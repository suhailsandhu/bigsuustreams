<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Website is updating | BigSuuStreams</title>
  <link rel="icon" type="image/png" href="/app-brand-logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
      -webkit-user-select: none;
    }
    .container {
      max-width: 440px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-col;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .logo-wrap {
      margin-bottom: 24px;
    }
    .logo-img {
      width: 104px;
      height: 104px;
      object-fit: contain;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border: 1px solid #f3f4f6;
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.025em;
      color: #111827;
      line-height: 1.2;
    }
    p.subtitle {
      font-size: 15px;
      font-weight: 600;
      color: #4b5563;
      margin-top: 10px;
      line-height: 1.5;
    }
    .pill {
      margin-top: 32px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #9ca3af;
      border-top-color: #111827;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .reload-btn {
      margin-top: 24px;
      background: transparent;
      border: none;
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
      padding: 6px 12px;
    }
    .reload-btn:hover {
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="/app-brand-logo.png" alt="BigSuuStreams NBA & NFL" class="logo-img">
    </div>
    <h1>Website is updating</h1>
    <p class="subtitle">Website is updating. Check back in two minutes.</p>

    <div class="pill">
      <div class="spinner"></div>
      <span id="status-text">Checking status...</span>
    </div>

    <button class="reload-btn" onclick="window.location.href='/'">Tap here to reload now</button>
  </div>

  <script>
    let dots = 0;
    const statusEl = document.getElementById('status-text');
    setInterval(() => {
      dots = (dots + 1) % 4;
      statusEl.textContent = 'Checking status' + '.'.repeat(dots);
    }, 500);

    // Auto-poll system status
    async function checkServer() {
      try {
        const res = await fetch('/api/system-status', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.updating === false) {
            window.location.href = '/';
            return;
          }
        }
      } catch (e) {
        // Still updating
      }
      setTimeout(checkServer, 2500);
    }

    setTimeout(checkServer, 2000);
  </script>
</body>
</html>
